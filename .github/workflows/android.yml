# Compila la app Android de MandaoYa en la nube de GitHub cada vez que subes cambios.
# Descarga el APK en: pestaña Actions › la última ejecución › Artifacts › mandaoya-android
name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

