>>>>>>> 4f452de3e5e4ff9ca2e3a44abe7fa2189169d1fa
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar proyecto Android
        run: npm run build:www && npm run android:add && npm run android:assets

      - name: google-services.json (notificaciones push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Push activado"
          else
            echo "Sin google-services.json: la app compila, pero sin notificaciones push"
          fi

      - name: Ajustes y sincronización
        run: npm run android:patch && npx cap sync android

      - name: Compilar APK de prueba
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Compilar versión firmada para Play Store (si hay llave)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sin llave de firma: se omite la versión para Play Store"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          ./gradlew bundleRelease assembleRelease --no-daemon
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          "$ANDROID_SDK_ROOT"/build-tools/$(ls "$ANDROID_SDK_ROOT"/build-tools | sort -V | tail -1)/apksigner sign \
            --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out app/build/outputs/apk/release/mandaoya-release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mandaoya-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/mandaoya-release.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
